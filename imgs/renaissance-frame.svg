<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cornice ornamentale dorata per il tema English Renaissance (usata come sfondo delle immagini in main.css).
  Niente viewBox: la cornice si adatta a qualsiasi proporzione senza deformare gli ornamenti.
  - montanti in oro brunito (fascia tra 12 e 22 px dal bordo, disegnata con rettangoli + maschere)
  - borchia con volute ai quattro angoli
  - giglio con volute al centro in alto e in basso
  - medaglioni ovali a metà dei lati
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- oro brunito (stessi toni della prima cornice) per gli ornamenti -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6A2F"/>
      <stop offset="0.25" stop-color="#E6C97A"/>
      <stop offset="0.5" stop-color="#A67C35"/>
      <stop offset="0.75" stop-color="#F1DC9A"/>
      <stop offset="1" stop-color="#8A6A2F"/>
    </linearGradient>

    <!-- stesso oro per i montanti, ripetuto a riflesso così luccica lungo tutta la cornice -->
    <linearGradient id="goldRail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="90" spreadMethod="reflect">
      <stop offset="0" stop-color="#8A6A2F"/>
      <stop offset="0.25" stop-color="#E6C97A"/>
      <stop offset="0.5" stop-color="#A67C35"/>
      <stop offset="0.75" stop-color="#F1DC9A"/>
      <stop offset="1" stop-color="#8A6A2F"/>
    </linearGradient>

    <!-- maschere: tolgono una fascia di N px lungo tutto il bordo -->
    <mask id="cut11" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="white"/>
      <rect width="100%" height="100%" fill="none" stroke="black" stroke-width="22.8"/>
    </mask>
    <mask id="cut19" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="white"/>
      <rect width="100%" height="100%" fill="none" stroke="black" stroke-width="38.4"/>
    </mask>
    <mask id="cut21" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="white"/>
      <rect width="100%" height="100%" fill="none" stroke="black" stroke-width="43.2"/>
    </mask>
    <mask id="cut26" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="white"/>
      <rect width="100%" height="100%" fill="none" stroke="black" stroke-width="52"/>
    </mask>

    <!-- voluta lungo il bordo superiore (parte dall'angolo e va verso destra) -->
    <g id="scroll">
      <path d="M26 17 C34 11,44 9,52 12 C44 13,36 16,28 21 Z" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.7"/>
      <path d="M26 17 C34 9,46 7,54 11 C58 13,58 19,54 20 C51 21,49 18,51 16" fill="none" stroke="#6E4F1C" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- angolo in alto a sinistra: volute sui due lati + borchia -->
    <g id="corner">
      <use xlink:href="#scroll"/>
      <use xlink:href="#scroll" transform="matrix(0 1 1 0 0 0)"/>
      <g transform="translate(17 17)">
        <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.8"/>
        <circle r="5" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.8"/>
        <circle r="1.8" fill="#F1DC9A"/>
      </g>
    </g>

    <!-- metà sinistra della cresta (voluta + petalo laterale del giglio) -->
    <g id="crest-half">
      <path d="M-5 16 C-11 19,-19 19,-24 15 C-18 14,-11 13,-5 13 Z" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.7"/>
      <path d="M-6 17 C-12 22,-22 22,-27 16 C-30 12,-26 8,-23 11 C-21 13,-23 15,-24 14" fill="none" stroke="#6E4F1C" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M-2 16 C-10 16,-14 10,-12 6 C-10 3,-7 5,-8 8 C-9 11,-5 13,-1 13 Z" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.7"/>
    </g>

    <!-- cresta centrale con giglio (centrata in x=0, appoggiata al bordo y=0) -->
    <g id="crest">
      <use xlink:href="#crest-half"/>
      <use xlink:href="#crest-half" transform="scale(-1 1)"/>
      <path d="M0 3 C6 9,6 15,0 23 C-6 15,-6 9,0 3 Z" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.8"/>
      <path d="M0 18 L-2.5 26 L2.5 26 Z" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.6"/>
      <rect x="-7" y="15" width="14" height="3.5" rx="1" fill="#A67C35" stroke="#6E4F1C" stroke-width="0.7"/>
    </g>

    <!-- medaglione ovale (centrato in y=0, sul montante sinistro) -->
    <g id="medallion">
      <ellipse cx="17" cy="0" rx="9" ry="17" fill="url(#gold)" stroke="#6E4F1C" stroke-width="0.9"/>
      <ellipse cx="17" cy="0" rx="5.5" ry="12.5" fill="#F1DC9A" stroke="#6E4F1C" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- MONTANTI E TRAVERSE -->
  <g fill="none">
    <!-- fascia d'oro tra 11 e 22 px -->
    <rect width="100%" height="100%" stroke="url(#goldRail)" stroke-width="44" mask="url(#cut11)"/>
    <!-- filetto scuro esterno -->
    <rect width="100%" height="100%" stroke="#6E4F1C" stroke-width="24.6" mask="url(#cut11)"/>
    <!-- luce chiara interna -->
    <rect width="100%" height="100%" stroke="#F1DC9A" stroke-width="40" mask="url(#cut19)"/>
    <!-- filetto scuro interno -->
    <rect width="100%" height="100%" stroke="#6E4F1C" stroke-width="44.8" mask="url(#cut21)"/>
    <!-- battuta dorata a ridosso della foto -->
    <rect width="100%" height="100%" stroke="#C5A059" stroke-width="54" mask="url(#cut26)"/>
  </g>

  <!-- MEDAGLIONI SUI LATI -->
  <svg y="50%" overflow="visible">
    <use xlink:href="#medallion"/>
  </svg>
  <svg x="100%" y="50%" overflow="visible">
    <use xlink:href="#medallion" transform="scale(-1 1)"/>
  </svg>

  <!-- CRESTE IN ALTO E IN BASSO -->
  <svg x="50%" overflow="visible">
    <use xlink:href="#crest"/>
  </svg>
  <svg x="50%" y="100%" overflow="visible">
    <use xlink:href="#crest" transform="scale(1 -1)"/>
  </svg>

  <!-- ANGOLI -->
  <use xlink:href="#corner"/>
  <svg x="100%" overflow="visible">
    <use xlink:href="#corner" transform="scale(-1 1)"/>
  </svg>
  <svg y="100%" overflow="visible">
    <use xlink:href="#corner" transform="scale(1 -1)"/>
  </svg>
  <svg x="100%" y="100%" overflow="visible">
    <use xlink:href="#corner" transform="scale(-1 -1)"/>
  </svg>
</svg>
